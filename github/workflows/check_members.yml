name: 構成銘柄チェック

on:
  schedule:
    # 毎月1日 10:00 JST(cron は UTC)。6月末の定期入れ替えは7月1日の回で拾う
    - cron: "0 1 1 * *"
  workflow_dispatch:   # 手動実行用

permissions:
  contents: write      # CSVをコミットするため

concurrency:
  group: check-members
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 構成銘柄を取得して比較
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scripts/check_members.py

      - name: 変更をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "構成銘柄チェック $(TZ=Asia/Tokyo date +%F)"
            git push
          fi

      # スクリプト自体の想定外エラー(取得失敗はスクリプト内で通知済み)も知らせる
      - name: 失敗を通知
        if: failure()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -z "$DISCORD_WEBHOOK_URL" ] && exit 0
          curl -sS -H "Content-Type: application/json" \
            -d "{\"content\":\"❌ 構成銘柄チェックのワークフローが失敗しました\n${RUN_URL}\"}" \
            "$DISCORD_WEBHOOK_URL"
